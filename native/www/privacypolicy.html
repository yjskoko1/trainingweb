<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개인정보 처리방침</title>
<style>body{font-family:sans-serif;padding:20px;line-height:1.7;color:#16181A}</style></head><body>
<h1>트레이닝웹 개인정보 처리방침</h1>
<p>트레이닝웹은 개인이 자신의 운동 기록을 관리하려고 만든 앱이에요.</p>
<h2>건강 데이터</h2>
<p>헬스 커넥트에서 운동 기록(러닝·수영의 거리, 시간), 심박수, 수면 시간을 읽어 와 운동 기록과 처방에 써요. 이 데이터는 휴대폰 안의 앱 저장소에만 저장되고, 어떤 서버로도 보내지 않아요. 데이터를 쓰거나 바꾸지 않고 읽기만 해요.</p>
<h2>권한 끄기</h2>
<p>언제든 헬스 커넥트 설정에서 이 앱의 권한을 끌 수 있어요.</p>
</body></html>
