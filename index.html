<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181A">
<meta name="mobile-web-app-capable" content="yes">
<title>트레이닝웹</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F2;--card:#FFFFFF;--ink:#16181A;--sub:#5B6068;--mute:#6B7079;--line:#EEF0F3;--blue:#1F55D6;--blueBg:#EEF3FF;--green:#1F7A44;--greenBg:#EAF6EE;--red:#B4441C;--redBg:#FBEDE6;--chip:#E6E8E4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:calc(110px + env(safe-area-inset-bottom))}
header{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}
header .ttl{flex:1;min-width:0}
.eyebrow{font-size:13px;color:var(--sub);font-weight:500}
h1{margin:2px 0 0;font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
h1.long{font-size:20px}
main{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.icon{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);text-decoration:none}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-size:17px;font-weight:700}
.meta{font-size:13px;color:var(--sub)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0}
.sectitle{font-size:13px;font-weight:700;color:var(--sub);padding:6px 4px 0;display:flex;align-items:center}
.note{font-size:12px;color:var(--sub);padding:0 4px;line-height:1.55}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:28px 12px;line-height:1.7}
.primary{width:100%;min-height:54px;border:none;border-radius:14px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;padding:0 14px}
.primary:disabled{background:#B8BCC2}
.secondary{width:100%;min-height:52px;border:none;border-radius:14px;background:var(--chip);font-size:15px;font-weight:700;padding:8px 14px;color:var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.danger{width:100%;min-height:52px;border:none;border-radius:14px;background:var(--redBg);color:var(--red);font-size:15px;font-weight:700}
.ghost{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #DADDE2;background:#fff;font-size:13px;color:#4A4F57}
.btnrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.btnrow>*{min-width:0}
.list{background:var(--card);border-radius:18px;padding:2px 16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;min-height:58px;border:none;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;text-decoration:none;color:inherit}
.li:last-child{border-bottom:none}
.li .t{font-size:15px;font-weight:700}
.chev{color:#9AA0A8;flex-shrink:0}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;flex-shrink:0}
.b-up{background:#3B7BFF;color:#fff}.b-keep{background:var(--chip);color:var(--ink)}.b-down{background:var(--red);color:#fff}.b-new{background:var(--greenBg);color:var(--green)}
.delta{font-size:12px;font-weight:700}
.d-up{color:var(--blue)}.d-down{color:var(--red)}.d-keep{color:var(--sub)}
.bars{display:flex;gap:4px;align-items:center}
.bars i{flex:1;height:6px;border-radius:3px;background:#E1E3E0;display:block}
.bars i.w{background:#C9CDD3}.bars i.wd{background:#9AA0A8}.bars i.d{background:var(--ink)}
.bars .gap{flex:0 0 6px;background:none}
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1;height:8px;background:#E1E3E0;border-radius:999px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.excard{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border:2px solid transparent}
.excard.cur{border-color:var(--ink)}
.excard.done{opacity:.72}
.rx{background:var(--ink);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.rx .big{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.rx .big small{font-size:17px;font-weight:700;color:#C9CDD3}
.rx .why{font-size:13px;color:#C9CDD3;line-height:1.5}
.rx.down{background:#fff;color:var(--ink);border:2px solid var(--red)}
.rx.down .big small,.rx.down .why{color:#4A4F57}
.srow{display:grid;grid-template-columns:38px minmax(0,1fr) 52px;align-items:center;min-height:52px;border-radius:12px;padding:2px 2px 2px 6px;gap:6px}
.srow .no{font-size:12px;font-weight:700;color:var(--mute)}
.srow .val{border:none;background:none;text-align:left;font-size:17px;min-height:48px;padding:0 4px;display:flex;align-items:center;gap:6px;border-radius:10px}
.srow .val b{font-weight:900}
.srow .val small{font-size:12px;color:var(--sub)}
.srow .val{flex-wrap:wrap;row-gap:0;align-content:center}
.srow .val .plates{flex-basis:100%;font-size:12px;color:var(--sub);font-weight:500;line-height:1.3}
.srow.done{background:var(--greenBg)}
.srow.done .no{color:var(--green)}
.srow.next{outline:2px solid var(--blue);outline-offset:-2px}
.srow.next .no{color:var(--blue)}
.repchips{display:flex;gap:6px;padding:6px 2px 10px 2px;margin-left:42px;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.repchips::-webkit-scrollbar{display:none}
.repchips button{flex:0 0 46px;height:44px;scroll-snap-align:center;border-radius:10px;border:1px solid #C9D6F5;background:#fff;font-size:16px;font-weight:700;color:var(--ink)}
.repchips button.plan{background:var(--blue);border-color:var(--blue);color:#fff}
.repchips.hint{font-size:11px;color:var(--sub);overflow:visible;margin-top:-4px}
.tick{width:48px;height:48px;border-radius:12px;border:2px solid #C4C8CE;background:#fff;display:flex;align-items:center;justify-content:center}
.srow.done .tick{background:var(--green);border-color:var(--green)}
.tabs3{background:var(--chip);border-radius:14px;padding:4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tabs3.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tabs3 button{min-height:42px;border:none;border-radius:11px;background:transparent;font-size:14px;font-weight:500;color:#4A4F57}
.tabs3 button.on{background:#fff;font-weight:700;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.chip{flex:0 0 auto;height:38px;padding:0 14px;border-radius:999px;border:none;background:#F1F2F0;font-size:13px;font-weight:500;color:#4A4F57}
.chip.on{background:var(--ink);color:#fff;font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E4E6E9;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:64px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--mute);text-decoration:none}
nav.tabs a.on{color:var(--ink);font-weight:700}
.timer{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:6;pointer-events:none}
.timer .in{pointer-events:auto;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer b{font-size:20px;font-variant-numeric:tabular-nums}
.timer button{height:40px;padding:0 12px;border-radius:999px;border:none;background:#33373C;color:#fff;font-size:13px;font-weight:700}
.timer.end .in{background:var(--green)}
.modal{position:fixed;inset:0;background:rgba(10,12,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal .sheet>*{flex-shrink:0}
.modal .sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.modal h2{margin:0;font-size:20px}
.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:8px}
.stepper button{height:60px;border:none;border-radius:14px;background:#EEF0F3;font-size:26px;font-weight:700}
.stepper input{height:60px;border:1px solid #DADDE2;border-radius:14px;text-align:center;font-size:26px;font-weight:900;width:100%;background:#fff;min-width:0}
.lbl{font-size:13px;color:var(--sub);font-weight:700}
.field{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--line);gap:12px}
.field:last-child{border-bottom:none}
.field label{font-size:15px;font-weight:500}
.field input[type=text],.field select{height:42px;border:1px solid #DADDE2;border-radius:10px;padding:0 10px;font-size:15px;background:#fff;max-width:200px;width:100%}
.field input[type=number]{height:42px;width:90px;border:1px solid #DADDE2;border-radius:10px;padding:0 10px;font-size:15px;text-align:right;background:#fff}
.seg{background:var(--chip);border-radius:14px;padding:4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{min-height:44px;border:none;border-radius:11px;background:transparent;font-size:14px;font-weight:500;color:#4A4F57}
.seg button.on{background:#fff;font-weight:700;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;height:50px;border:1px solid #DADDE2;border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
.addrow button{height:50px;padding:0 16px;border:none;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.plus{width:44px;height:44px;border-radius:12px;border:none;background:#EEF0F3;font-size:22px;font-weight:700;flex-shrink:0}
.mini{width:42px;height:42px;border-radius:10px;border:none;background:#EEF0F3;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;font-weight:700}
.mini:disabled{opacity:.35}
.drag{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:#9AA0A8;touch-action:none;cursor:grab;flex-shrink:0;border-radius:10px}
.drag:active{cursor:grabbing}
.dragging{position:relative;z-index:3;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:12px}
.shifting{transition:transform .15s}
.pick{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;padding:0 2px;width:100%}
.pick .box{width:28px;height:28px;border-radius:8px;border:2px solid #C4C8CE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick.on .box{background:var(--ink);border-color:var(--ink)}
.wkbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:64px;border:1px solid #DADDE2;border-radius:16px;background:#fff;padding:12px 14px;text-align:left}
.wkbtn.next{border:2px solid var(--ink)}
.wkbtn .t{font-size:16px;font-weight:700}
.tag{font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:3px 8px;flex-shrink:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--sub);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1/1.1;border:none;border-radius:12px;background:#F7F8F9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:5px;font-size:14px;font-weight:500;min-height:44px}
.cal button.blank{visibility:hidden}
.cal button.today{outline:2px solid var(--ink);outline-offset:-2px;font-weight:900}
.cal button.has{background:#fff}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:30px}
.cal .dots i{width:7px;height:7px;border-radius:50%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--sub)}
.legend span{display:flex;align-items:center}
.readout{font-size:13px;color:var(--sub);min-height:20px}
.readout b{color:var(--ink);font-size:16px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.toast{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.toast.ok{background:var(--greenBg);color:#174D2E}
.toast.err{background:var(--redBg);color:var(--red)}
.banner{background:#FFF4DB;color:#5C4200;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #DADDE2}
.swatches button.on{box-shadow:0 0 0 3px var(--ink)}
.sr{position:absolute;left:-9999px}
.swipewrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swipewrap:last-child{border-bottom:none}
.swipebg{position:absolute;inset:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font-weight:700;font-size:14px}
.swipe{position:relative;background:#fff;padding:12px 4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swipe.anim{transition:transform .2s}
textarea{width:100%;min-height:120px;border:1px solid #DADDE2;border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,monospace}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7FA3F5;outline-offset:2px}
</style>
</head>

<div id="modal"></div>

 var m=modeOf(k),e=ec(e0,m),st=progress(e0,k,m),d=db.days[k],W=d&&d.wo&&d.wo[e.id]!=null?d.wo[e.id]:st.t,p=plan(e);
 var prev=st.last&&st.lastSets&&st.lastSets.length&&st.lastSets[0].w===W?modeSets(st.last,e.id,m).filter(function(s){return s.w===W}):null;
 var work=[];for(var i=0;i<p.sets;i++){var r=p.max;if(e.method==='double'){r=p.min;if(prev&&prev[i])r=Math.min(p.max,Math.max(p.min,prev[i].r+1))}work.push({w:W,r:r})}
 var delta=st.last?fix(W-Math.max.apply(null,modeSets(st.last,e.id,m).map(function(s){return s.w}))):null;
 return{st:st,W:W,custom:d&&d.wo&&d.wo[e.id]!=null,p:p,warm:warmups(e,W),work:work,delta:delta,mode:m,c:e};
}
function exStatus(e,k){
 if(isCardio(e)){var cl=setsOn(k,e.id);return{cardio:true,list:cl,done:cl.length>0,workDone:cl.length,warmDone:0}}
 var r=rx(e,k),wl=setsOn(k,e.id,true).length,kl=setsOn(k,e.id,false).length;
 return{rx:r,warmDone:Math.min(wl,r.warm.length),workDone:kl,done:kl>=r.work.length};
}
function oneRM(exId){
 var best=null,recent=null,top=null;
 sortedDates().forEach(function(k){
  var ss=setsOn(k,exId,false).filter(function(s){return s.w>0&&s.r>=1}),dayBest=null;
  ss.forEach(function(s){
   if(!top||s.w>top.s.w)top={s:s,k:k};
   if(s.r>15)return;var v=e1rm(s.w,s.r);
   if(!dayBest||v>dayBest.v)dayBest={v:v,s:s,k:k};
  });
  if(dayBest){recent=dayBest;if(!best||dayBest.v>best.v)best=dayBest}
 });
 return best?{best:best,recent:recent,top:top}:null;
}
function rmTxt(v){return String(Math.round(v*2)/2)}
function prIds(exId){var best=0,ids={},all=[];sortedDates().forEach(function(k){setsOn(k,exId,false).forEach(function(s){all.push(s)})});all.sort(byTs);all.forEach(function(s){var v=e1rm(s.w,s.r);if(s.w>0&&v>best+1e-9){best=v;ids[s.id]=1}});return ids}
function nextWk(before,pid){var l=pid?progWks(pid):activeWks();if(!l.length)return null;var last=null;sortedDates().forEach(function(k){var d=db.days[k];if(k<before&&d.workout&&d.done&&wkById(d.workout))last=d.workout});if(!last)return l[0];return l[(l.indexOf(wkById(last))+1)%l.length]}
function dayOrder(k){
 var d=db.days[k],order=[];if(!d)return order;
 d.plan.forEach(function(id){var x=exById(id);if(x&&!x.deleted&&order.indexOf(id)<0)order.push(id)});
 d.sets.slice().sort(byTs).forEach(function(s){if(order.indexOf(s.exId)<0)order.push(s.exId)});
 /* 같은 부위끼리 모아서 보여줌 (처음 나온 부위 순서) */
 var co=[],cat=function(id){var x=exById(id);return x?x.cat:''};order.forEach(function(id){if(co.indexOf(cat(id))<0)co.push(cat(id))});
 return order.map(function(id,i){return{id:id,i:i}}).sort(function(a,b){return co.indexOf(cat(a.id))-co.indexOf(cat(b.id))||a.i-b.i}).map(function(x){return x.id});
}

 if(left<=0){clearInterval(rest.iv);rest.iv=null;el.innerHTML='<div class="timer end"><div class="in" role="status"><span>휴식 끝! 다음 세트</span><button data-a="rest-stop">닫기</button></div></div>';try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}beep();notifyEnd();return}
 var txt=Math.floor(left/60)+':'+String(left%60).padStart(2,'0'),b=document.getElementById('restleft');
 if(b){b.textContent=txt;return}
 el.innerHTML='<div class="timer"><div class="in" role="timer"><span>휴식</span><b id="restleft">'+txt+'</b><button data-a="rest-add">+30초</button><button data-a="rest-stop">건너뛰기</button></div></div>';
}

  else if(runGraph==='pred'||runGraph==='eff')h+=extra2;

function formSheet(e){
 var f=FORM[e.name],yt='https://www.youtube.com/results?search_query='+encodeURIComponent(e.name+' 자세');
 var h='<h2>'+esc(e.name)+' 자세</h2>';
 if(f){h+='<div class="card" style="background:#F4F5F2;gap:8px"><div class="name" style="font-size:15px">순서</div><ol style="margin:0;padding-left:20px;line-height:1.7;font-size:14px">'+f[0].map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol></div>';
  if(f[1]&&f[1].length)h+='<div class="card" style="background:#FFF6E5;gap:8px"><div class="name" style="font-size:15px">주의할 점</div><ul style="margin:0;padding-left:20px;line-height:1.7;font-size:14px">'+f[1].map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul></div>'}
 else h+='<div class="note" style="padding:0">직접 추가한 종목이라 기본 설명이 없어요. 아래 영상 검색으로 확인해 보세요.</div>';
 if(e.memo)h+='<div class="card" style="gap:6px"><div class="name" style="font-size:15px">내 메모</div><div class="meta" style="white-space:pre-wrap">'+esc(e.memo)+'</div></div>';
 h+='<a class="secondary" href="'+yt+'" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">유튜브에서 자세 영상 찾기</a><div class="note" style="padding:0">처음 하는 운동이나 무거운 무게는 트레이너에게 자세를 한 번 확인받는 게 가장 안전해요.</div><button class="primary" data-a="modal-close">닫기</button>';

}
window.addEventListener('hashchange',function(){if(location.hash!==routed)route(location.hash)});
document.addEventListener('click',function(ev){var a=ev.target.closest&&ev.target.closest('a[href^="#"]');if(!a)return;ev.preventDefault();var href=a.getAttribute('href');if(a.closest('nav.tabs')||href==='#today')curDate=href==='#today'&&!a.closest('nav.tabs')?curDate:todayKey();go(href)},true);

/* =============== boot =============== */
try{
 var loaded=load();db=loaded?normalize(loaded):null;
 if(!db){db=defaults();saveNow()}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 route();
}catch(err){document.getElementById('app').innerHTML='<header><div class="ttl"><div class="eyebrow">문제가 생겼어요</div><h1>불러오지 못했어요</h1></div></header><main><div class="toast err">'+esc(err&&err.message||String(err))+'</div></main>'}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
